services:
  - type: web
    name: computer-monitoring-api
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: monitoring-data
      mountPath: /var/data
      sizeGB: 1
